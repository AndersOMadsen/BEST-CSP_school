    rungs:
      - {tag: "00_reference",    op: reference}
      - {tag: "01_res_1p0",      op: truncate_resolution,        d_min: 1.0}
      - {tag: "02_res_1p2",      op: truncate_resolution,        d_min: 1.2}
      - {tag: "03_complete_88",  op: reduce_completeness_unique, fraction_remove: 0.12, seed: 1}
      - {tag: "04_complete_80",  op: reduce_completeness_unique, fraction_remove: 0.20, seed: 1}
      - {tag: "05_cone_3ded",    op: remove_cone, tilt_axis: [0.0, 1.0, 0.0], max_tilt_deg: 55.0}
      - {tag: "06_wedge_lowang", op: remove_wedge,               axis: l, frac_low: 0.0, frac_high: 0.30, low_angle_bias: true}
      - {tag: "07_weak",         op: simulate_weak_data,         sigma_inflate: 2.0}
      - {tag: "08_absorption",   op: inject_absorption_error,    mu_t: 0.8, axis: [0.0, 1.0, 1.0]}
    # ── Model-error rungs ──────────────────────────────────────────────────────
    # MS: Pbca (centrosymmetric, LATT 1) → Pca2(1) by removing inversion centre.
    ms_rung:
      enabled: true
      drop_to_subgroup: "Pca2(1)"
      shift_to_origin: null
      note: "Pbca → Pca2(1) by removing inversion centre (LATT 1 → -1)"
    wa_rung:
      enabled: true
      swaps:
        - {atom: "S1", from_element: "S", to_element: "O"}
      note: "S→O swap at S1: O has smaller scattering factor, causing unrealistically small ADP"
    # MA: jp2026 is a monohydrate — O1/H1A/H1B are the water molecule.
    # The water H atoms are free-standing (not in AFIX blocks) so no AFIX
    # cleanup is needed.  UNIT: O 8→0, H 136→120.
    # Formula/density in the assembled CIF are preserved from the published
    # CIF (including water) — the mismatch is an intended diagnostic.
    ma_rung:
      enabled: true
      delete_atoms:
        - "O1"
        - "H1A"
        - "H1B"
      preserve_formula_fields: false
      note: "Hydrate water (O1, H1A, H1B) deleted from model; data and chemical formula unchanged"

