# structures.yaml — per-structure configuration for run_ladder.py
#
# Each entry in `structures` defines one source structure.  Edit the `rungs`
# list to tune the degradation ladder before running.
#
# Radiation guidance (from DEGRADATION_PROTOCOL.md):
#   Mo Kα (~0.71 Å):  d_min typically 0.75–0.80 Å.  Full resolution ladder
#                      available (d_min 1.0 and 1.2 Å are meaningful rungs).
#   Cu Kα (~1.54 Å):  d_min typically 0.82–0.84 Å — barely past the Acta limit
#                      (0.83 Å).  Resolution truncation is a weak lever; lean on
#                      completeness, wedge, and weak-data rungs instead.
#
# Completeness thresholds: <95% → alert C, <90% → B, <85% → A.
# Target completeness just inside the desired band and confirm from the report.
#
# shelx_name: the filename stem for .hkl/.ins/.res/.cif (usually "I", sometimes
#             differs — check the structure directory).
# published_cif: the deposited/published CIF in the structure directory.
#                This is used ONLY as the source of header metadata; it is NOT
#                submitted to checkCIF.  Keep the filename exact (case-sensitive).

structures:

  # ── Mo Kα ──────────────────────────────────────────────────────────────────

  - id: ej2019
    path: Good_Structures_and_data/ej2019
    shelx_name: I
    published_cif: ej2019.cif
    radiation: Mo
    wavelength: 0.71073
    space_group: "C 2/c"
    # a, b, c (Å), alpha, beta, gamma (°) — from CELL line in I.ins
    cell: [15.3925, 23.1494, 15.9075, 90.0, 90.577, 90.0]
    rungs:
      - {tag: "00_reference",    op: reference}
      - {tag: "01_res_1p0",      op: truncate_resolution,        d_min: 1.0}
      - {tag: "02_res_1p2",      op: truncate_resolution,        d_min: 1.2}
      - {tag: "03_complete_88",  op: reduce_completeness_unique, fraction_remove: 0.12, seed: 1}
      - {tag: "04_complete_80",  op: reduce_completeness_unique, fraction_remove: 0.20, seed: 1}
      - {tag: "05_cone_3ded",    op: remove_cone, tilt_axis: [0.0, 1.0, 0.0], max_tilt_deg: 55.0}
      - {tag: "06_wedge_lowang", op: remove_wedge,               axis: l, frac_low: 0.0, frac_high: 0.30, low_angle_bias: true}
      - {tag: "07_weak",         op: simulate_weak_data,         sigma_inflate: 2.0}
      # Absorption: axis [0,1,1] breaks the monoclinic 2/m Laue symmetry so that
      # Laue-equivalent observations get DIFFERENT transmission factors — this creates
      # genuine internal inconsistency (Rint rises) and forces ADP distortion.
      # mu_t is elevated for uranium (high intrinsic absorption at Mo Kα).
      - {tag: "08_absorption",   op: inject_absorption_error,    mu_t: 2.0, axis: [0.0, 1.0, 1.0]}

